name = "reverse-geocoding"
main = "src/worker/index.ts"
# The newest date the pinned workerd in the test pool supports.
compatibility_date = "2026-08-15"

# data/build/*.bin are imported as ArrayBuffers.
rules = [{ type = "Data", globs = ["**/*.bin"], fallthrough = false }]

# Production answers only on its custom domain; attribution_url is derived from the request origin.
routes = [{ pattern = "reverse-geocode.vibecodedapps.net", custom_domain = true }]
workers_dev = false

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "DailyCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyCounter"]

[observability.logs]
enabled = true
# Invocation logs record the request URL. Off, so the only log lines are the Worker's own.
invocation_logs = false

# Secret, not a var: KEYS is a JSON list of {"id", "sha256", "daily_limit"}.
# Set with: wrangler secret put KEYS

# A separate Worker with its own keys and counter, for callers' development environments.
# Deploy with: wrangler deploy --env dev. Durable Object bindings are not inherited.
# routes and workers_dev are, so dev overrides both to stay on its workers.dev URL.
[env.dev]
routes = []
workers_dev = true

[[env.dev.durable_objects.bindings]]
name = "COUNTER"
class_name = "DailyCounter"
